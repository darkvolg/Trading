server {
    listen 80;
    listen [::]:80;
    server_name trendrider.pro www.trendrider.pro;

    root /var/www/trendrider.pro;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA routing — try file, then .html, then 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Blog clean URLs
    location /blog/ {
        try_files $uri $uri.html $uri/ /blog.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }

    # SSL will be added by certbot automatically:
    # sudo certbot --nginx -d trendrider.pro -d www.trendrider.pro
}
