server {
    listen 80;
    listen [::]:80;
    server_name trendrider.pro www.trendrider.pro;

    root /var/www/trendrider.pro;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Next.js hashed static assets — immutable, cache forever
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static assets — long cache
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and icons — 30 days
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # HTML pages — short cache, must revalidate
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # SPA routing — try file, then .html, then 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Blog clean URLs
    location /blog/ {
        try_files $uri $uri.html $uri/ /blog.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/xhtml+xml font/woff2;
    gzip_min_length 256;
    gzip_static on;

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }

    # SSL will be added by certbot automatically:
    # sudo certbot --nginx -d trendrider.pro -d www.trendrider.pro
}
