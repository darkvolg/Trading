<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrendRider — Open-source crypto trading strategy">
  <defs>
    <!-- Subtle radial glow -->
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <!-- Accent gradient for title -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#7AE7CF"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#0D1117"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Top brand strip -->
  <rect x="0" y="0" width="1280" height="3" fill="#00D4AA"/>

  <!-- Logo + brand name (left) -->
  <g transform="translate(60, 90)">
    <!-- Candlestick logo group -->
    <g transform="translate(0, 0)">
      <!-- Main candle -->
      <rect x="20" y="12" width="20" height="40" rx="3" fill="#00D4AA"/>
      <line x1="30" y1="2" x2="30" y2="12" stroke="#00D4AA" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="52" x2="30" y2="62" stroke="#00D4AA" stroke-width="3" stroke-linecap="round"/>
      <!-- Left accent (smaller, dimmer) -->
      <rect x="0" y="22" width="12" height="22" rx="2" fill="#00D4AA" opacity="0.4"/>
      <line x1="6" y1="16" x2="6" y2="22" stroke="#00D4AA" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <line x1="6" y1="44" x2="6" y2="50" stroke="#00D4AA" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <!-- Right accent (gold, dimmer) -->
      <rect x="50" y="18" width="12" height="28" rx="2" fill="#FFD700" opacity="0.4"/>
      <line x1="56" y1="10" x2="56" y2="18" stroke="#FFD700" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <line x1="56" y1="46" x2="56" y2="54" stroke="#FFD700" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    </g>

    <!-- Brand name -->
    <text x="90" y="40" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#titleGrad)">TrendRider</text>
    <text x="90" y="68" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#8B949E" letter-spacing="2">OPEN-SOURCE · HYPEROPT-TUNED</text>
  </g>

  <!-- Tagline (center-right) -->
  <g transform="translate(60, 200)">
    <text font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#E6EDF3">Open-source crypto trading strategy for Freqtrade</text>
    <text y="32" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#8B949E">Multi-indicator confluence · Walk-forward validated · Public live performance</text>
  </g>

  <!-- Stats panel (right) -->
  <g transform="translate(820, 80)">
    <!-- Background card -->
    <rect width="400" height="160" rx="12" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <!-- Row 1: Verify -->
    <text x="24" y="36" font-family="JetBrains Mono, monospace" font-size="11" fill="#8B949E" letter-spacing="1.5">DON'T TRUST — VERIFY</text>
    <text x="24" y="68" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="#00D4AA">trendrider.net/live</text>
    <text x="24" y="90" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8B949E">Real-time trades · P&amp;L · win rate · drawdown</text>
    <!-- Divider -->
    <line x1="24" y1="106" x2="376" y2="106" stroke="#21262D" stroke-width="1"/>
    <!-- Row 2: Methodology -->
    <text x="24" y="128" font-family="JetBrains Mono, monospace" font-size="11" fill="#8B949E" letter-spacing="1.5">PAPER-TRADING SINCE APR 1, 2026</text>
    <text x="24" y="148" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E6EDF3">Hyperopt + walk-forward validated · Open-source on GitHub</text>
    <!-- Live indicator dot -->
    <circle cx="380" cy="32" r="5" fill="#00D4AA">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom accent line — small candle pattern -->
  <g transform="translate(60, 280)" opacity="0.3">
    <rect x="0" y="0" width="6" height="12" fill="#00D4AA"/>
    <rect x="14" y="-4" width="6" height="20" fill="#00D4AA"/>
    <rect x="28" y="-2" width="6" height="14" fill="#00D4AA"/>
    <rect x="42" y="-8" width="6" height="24" fill="#00D4AA"/>
    <rect x="56" y="-12" width="6" height="28" fill="#00D4AA"/>
    <rect x="70" y="-6" width="6" height="18" fill="#00D4AA"/>
    <rect x="84" y="-10" width="6" height="22" fill="#00D4AA"/>
    <rect x="98" y="-14" width="6" height="26" fill="#00D4AA"/>
    <rect x="112" y="-18" width="6" height="30" fill="#00D4AA"/>
    <rect x="126" y="-16" width="6" height="28" fill="#00D4AA"/>
    <rect x="140" y="-22" width="6" height="36" fill="#00D4AA"/>
  </g>
</svg>
