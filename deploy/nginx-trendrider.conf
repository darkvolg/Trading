# TrendRider Landing — Nginx config
# Deploy: copy to /etc/nginx/sites-available/trendrider
# Then: ln -s /etc/nginx/sites-available/trendrider /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# Redirect www to non-www (both domains)
server {
    listen 80;
    server_name www.trendrider.ru www.trendrider.net;
    return 301 http://$host$request_uri;
}

# Main server block — both domains
server {
    listen 80;
    server_name trendrider.ru trendrider.net;

    root /var/www/trendrider;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Next.js static export — handle routes
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Error pages
    error_page 404 /404.html;
}
